# Build on every push and pull request. On a v* tag, also sign the exe and
# publish a GitHub release. Signing setup: docs/code-signing.md
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match VERSION $ver" }

      - name: Build
        shell: cmd
        run: build.bat

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          $lines = Get-Content CHANGELOG.md
          $start = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l.StartsWith("## [$ver]") })
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $ver" }
          $end = [array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l.StartsWith('## ') })
          if ($end -lt 0) { $end = $lines.Count }
          $notes = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          $notes += "`n`n---`n`n**Download:** ``TypeCommander-v$ver-win.zip`` (exe, README, CHANGELOG) or the bare ``TypeCommander.exe``.`n`n"
          $notes += "``TypeCommander.exe`` is code-signed. To verify, check *Properties > Digital Signatures*, or run ``Get-AuthenticodeSignature .\TypeCommander.exe`` in PowerShell; it should report ``Valid``."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Get-Content release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: TypeCommander
          path: dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: TypeCommander-exe-unsigned
          path: build/TypeCommander.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release      # holds the Azure secrets and signing variables
    permissions:
      contents: write         # create the GitHub release
      id-token: write         # OIDC login to Azure
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: TypeCommander-exe-unsigned
          path: build

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign TypeCommander.exe
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\build\TypeCommander.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: TypeCommander

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature build\TypeCommander.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($sig.Status -ne 'Valid') { throw "Signature status is $($sig.Status): $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "Signature has no timestamp" }

      - name: Package signed exe
        shell: cmd
        run: build.bat package

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: TypeCommander ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.zip
            build/TypeCommander.exe
          generate_release_notes: true
