name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match VERSION $ver" }

      - name: Build
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: TypeCommander
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TypeCommander-exe-unsigned
          path: build/TypeCommander.exe

  # Tagged releases only: sign the exe, rebuild the zip around it, publish.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # OIDC login to Azure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TypeCommander-exe-unsigned
          path: build

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign TypeCommander.exe
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\build\TypeCommander.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: TypeCommander

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature build\TypeCommander.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($sig.Status -ne 'Valid') { throw "Signature status is $($sig.Status): $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "Signature has no timestamp" }

      - name: Package signed exe
        shell: cmd
        run: build.bat package

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            build/TypeCommander.exe
          generate_release_notes: true
